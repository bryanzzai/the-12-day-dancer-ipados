name: Build The 12 Day Dancer Android Galaxy Tab A SM-T515

on:
  workflow_dispatch:
  push:
    branches: [android-galaxy-a16, galaxy-tab-a-sm-t515]
    paths:
      - 'AndroidDancer/**'
      - 'Scripts/generate_android_catalog.mjs'
      - '.github/workflows/build-android-galaxy-a16.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Android Dancer branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 API 36
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Checkout current concert-house source of truth
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/bryanmackayne-source"
          git clone --depth 1 https://github.com/bryanzzai/bryanmackayne.git "$SOURCE"
          git -C "$SOURCE" rev-parse HEAD | tee SOURCE-SITE-COMMIT.txt

      - name: Stage Bulgarian Ballerina launcher icon
        shell: bash
        run: |
          set -euo pipefail
          ICON_SOURCE="$RUNNER_TEMP/bryanmackayne-source/dies-solis/art/Bulgarian Ballerina [ I ].png"
          ICON_TARGET="AndroidDancer/app/src/main/res/drawable-nodpi/ic_launcher_ballerina.png"
          test -s "$ICON_SOURCE"
          mkdir -p "$(dirname "$ICON_TARGET")"
          cp "$ICON_SOURCE" "$ICON_TARGET"
          test -s "$ICON_TARGET"
          echo "Launcher icon staged from Dies Solis / Bulgarian Ballerina [ I ]."

      - name: Generate exact Android catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AndroidDancer/app/src/main/assets AndroidDancer/generated
          node Scripts/generate_android_catalog.mjs \
            --source "$RUNNER_TEMP/bryanmackayne-source" \
            --output-json "$PWD/AndroidDancer/app/src/main/assets/Catalog.generated.json" \
            --output-manifest "$PWD/AndroidDancer/generated/ConcertResources-manifest.tsv" \
            --asset-dir "$PWD/AndroidDancer/app/src/main/assets"

          node - <<'NODE'
          const fs = require('fs');
          const p = 'AndroidDancer/app/src/main/assets/Catalog.generated.json';
          const c = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (c.albums.length !== 12) throw new Error(`albums=${c.albums.length}`);
          const audio = c.albums.reduce((n,a) => n + a.tracks.length, 0);
          const video = c.albums.reduce((n,a) => n + a.films.length, 0);
          if (audio !== 245 || video !== 9) throw new Error(`audio=${audio} video=${video}`);
          console.log(`Verified Android catalog: ${c.albums.length} albums, ${audio} tracks, ${video} films`);
          NODE

      - name: Build debug APK
        shell: bash
        run: gradle --project-dir AndroidDancer :app:assembleDebug --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='AndroidDancer/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p delivery
          cp "$APK" 'delivery/The-12-Day-Dancer-Galaxy-Tab-A-SM-T515-v0.1-debug.apk'
          cp AndroidDancer/generated/ConcertResources-manifest.tsv delivery/
          cp SOURCE-SITE-COMMIT.txt delivery/
          sha256sum delivery/The-12-Day-Dancer-Galaxy-Tab-A-SM-T515-v0.1-debug.apk | tee delivery/SHA256.txt
          ls -lh delivery/

      - name: Upload Galaxy Tab A package
        uses: actions/upload-artifact@v4
        with:
          name: The-12-Day-Dancer-Galaxy-Tab-A-SM-T515-v0.1
          path: delivery/
          if-no-files-found: error
          retention-days: 30
