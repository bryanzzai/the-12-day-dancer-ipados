name: Build iPad Pro 12.9 TrollStore Lite edition

on:
  workflow_dispatch:
  push:
    branches: [ipad-pro-12-9-trollstore-lite]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout iPad Pro 12.9 source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Checkout current concert-house source of truth
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SITE="$RUNNER_TEMP/bryanmackayne-source"
          rm -rf "$SOURCE_SITE"
          git clone --depth 1 https://github.com/bryanzzai/bryanmackayne.git "$SOURCE_SITE"
          git -C "$SOURCE_SITE" rev-parse HEAD | tee SOURCE-SITE-COMMIT.txt

      - name: Download exact release media for catalog validation only
        shell: bash
        run: |
          set -euo pipefail
          MEDIA_ROOT="$RUNNER_TEMP/full-native-media"
          rm -rf "$MEDIA_ROOT"
          mkdir -p "$MEDIA_ROOT"
          audio_albums=(
            dies-iovis dies-solis dies-martis dies-albini dies-tigris dies-delfini
            dies-canis dies-felis dies-tauri dies-ursi dies-apri
          )
          for album in "${audio_albums[@]}"; do
            mkdir -p "$MEDIA_ROOT/$album"
            gh release download "$album" \
              --repo bryanzzai/bryanmackayne \
              --pattern '*.web.m4a' \
              --dir "$MEDIA_ROOT/$album" \
              --clobber
          done
          mkdir -p "$MEDIA_ROOT/dies-akita"
          gh release download dies-akita \
            --repo bryanzzai/bryanmackayne \
            --pattern '*.mp4' \
            --dir "$MEDIA_ROOT/dies-akita" \
            --clobber

          audio_count=$(find "$MEDIA_ROOT" -type f -name '*.web.m4a' | wc -l | tr -d ' ')
          video_count=$(find "$MEDIA_ROOT" -type f -name '*.mp4' | wc -l | tr -d ' ')
          originals=$(find "$MEDIA_ROOT" -type f -name '*.m4a' ! -name '*.web.m4a' | wc -l | tr -d ' ')
          test "$audio_count" = 229
          test "$video_count" = 9
          test "$originals" = 0
          echo "Catalog authority media verified: $audio_count web M4A + $video_count MP4; original M4A: $originals"

      - name: Generate exact catalog and external-library manifest
        shell: bash
        run: |
          set -euo pipefail
          node Scripts/generate_full_catalog.mjs \
            --source "$RUNNER_TEMP/bryanmackayne-source" \
            --media-root "$RUNNER_TEMP/full-native-media" \
            --ci-resource-dir "$PWD/ci-resources" \
            --output-swift "$PWD/App/Sources/Catalog.generated.swift" \
            --output-manifest "$PWD/App/Generated/ResourceManifest.tsv" \
            --output-report "$PWD/App/Generated/CatalogReport.txt"
          cat App/Generated/CatalogReport.txt

      - name: Generate Xcode 15 compatible project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d The12DayDancer.xcodeproj
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 17.0;' The12DayDancer.xcodeproj/project.pbxproj

      - name: Compile unsigned arm64 iPad app
        shell: bash
        run: |
          set -o pipefail
          THE12_PRESTAGED_RESOURCES="$PWD/ci-resources" \
          xcodebuild \
            -project The12DayDancer.xcodeproj \
            -scheme The12DayDancer \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-ipad-pro-12-9.log

      - name: Embed TrollStore Lite FileProvider entitlements
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*Build/Products/Debug-iphoneos/The 12 Day Dancer.app' -print -quit)
          test -n "$APP"
          EXE="$APP/The 12 Day Dancer"
          test -f "$EXE"

          # TrollStore Lite preserves entitlements already embedded in the main binary.
          # Ad-hoc sign only the executable so platform-application survives installation.
          /usr/bin/codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements App/TrollStoreLite.entitlements \
            "$EXE"

          /usr/bin/codesign -d --entitlements :- "$EXE" > effective-entitlements.plist 2>/dev/null
          /usr/bin/plutil -extract application-identifier raw effective-entitlements.plist | grep -Fx 'dk.bryanmackayne.the12daydancer'
          /usr/bin/plutil -extract platform-application raw effective-entitlements.plist | grep -Fx 'true'
          echo 'Verified embedded application-identifier + platform-application entitlements.'

      - name: Verify 12.9-inch TrollStore Lite build
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*Build/Products/Debug-iphoneos/The 12 Day Dancer.app' -print -quit)
          test -n "$APP"
          test -d "$APP/ConcertResources"
          test -s "$APP/ConcertResources/facade__background__bulgarian-ballerina.png"

          audio_count=$(find "$APP" -type f -name '*.m4a' | wc -l | tr -d ' ')
          video_count=$(find "$APP" -type f -name '*.mp4' | wc -l | tr -d ' ')
          test "$audio_count" = 0
          test "$video_count" = 0

          grep -q 'SIDESTORE-LITE-RESOURCE-ROOT' App/Sources/The12DayDancerApp.swift
          grep -q 'SIDESTORE-LITE-THUMBNAIL-RESOURCE-ROOT' App/Sources/FilmThumbnailView.swift
          grep -q 'ConcertImportHost { ContentView() }' App/Sources/The12DayDancerApp.swift
          grep -q 'IPAD-PRO-12-9-CONCERT-IMPORTER' App/Sources/ConcertImportHost.swift

          APP_PLIST="$APP/Info.plist" python3 - <<'PY'
          import os, plistlib
          with open(os.environ['APP_PLIST'], 'rb') as f:
              info = plistlib.load(f)
          assert info.get('CFBundleIdentifier') == 'dk.bryanmackayne.the12daydancer', info.get('CFBundleIdentifier')
          assert info.get('UIDeviceFamily') == [2], info.get('UIDeviceFamily')
          assert info.get('MinimumOSVersion') == '17.0', info.get('MinimumOSVersion')
          assert info.get('UIFileSharingEnabled') is True, info.get('UIFileSharingEnabled')
          assert info.get('LSSupportsOpeningDocumentsInPlace') is True, info.get('LSSupportsOpeningDocumentsInPlace')
          print('Verified iPad-only, iPadOS 17.0 minimum, file sharing enabled app.')
          PY

          /usr/bin/file "$APP/The 12 Day Dancer" | grep -q arm64
          /usr/bin/codesign -d --entitlements :- "$APP/The 12 Day Dancer" > effective-entitlements-verify.plist 2>/dev/null
          /usr/bin/plutil -extract platform-application raw effective-entitlements-verify.plist | grep -Fx 'true'
          echo "12.9 build verified: arm64, iPad family, iPadOS 17.0 minimum, Files importer, TrollStore Lite FileProvider entitlements, no concert media embedded."
          echo "$APP" > IPADPRO_APP_PATH.txt

      - name: Package TrollStore Lite IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(cat IPADPRO_APP_PATH.txt)
          rm -rf delivery Payload
          mkdir -p delivery Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload delivery/The-12-Day-Dancer-iPad-Pro-12.9-TrollStore-Lite.ipa

          python3 - <<'PY'
          import zipfile
          p='delivery/The-12-Day-Dancer-iPad-Pro-12.9-TrollStore-Lite.ipa'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
          assert any(n.startswith('Payload/') and n.endswith('.app/') for n in names), 'IPA missing Payload/*.app/'
          print('Verified IPA contains Payload/*.app/.')
          PY
          ls -lh delivery/The-12-Day-Dancer-iPad-Pro-12.9-TrollStore-Lite.ipa

      - name: Upload iPad Pro 12.9 TrollStore Lite IPA
        uses: actions/upload-artifact@v4
        with:
          name: The-12-Day-Dancer-iPad-Pro-12.9-TrollStore-Lite
          path: delivery/The-12-Day-Dancer-iPad-Pro-12.9-TrollStore-Lite.ipa
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
