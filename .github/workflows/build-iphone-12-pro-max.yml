name: Build SideStore Lite iPhone 12 Pro Max

on:
  workflow_dispatch:
  push:
    branches: [iphone-12-pro-max]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout iPhone 12 Pro Max source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Checkout current concert-house source of truth
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SITE="$RUNNER_TEMP/bryanmackayne-source"
          rm -rf "$SOURCE_SITE"
          git clone --depth 1 https://github.com/bryanzzai/bryanmackayne.git "$SOURCE_SITE"
          git -C "$SOURCE_SITE" rev-parse HEAD | tee SOURCE-SITE-COMMIT.txt

      - name: Download exact release media for catalog validation only
        shell: bash
        run: |
          set -euo pipefail
          MEDIA_ROOT="$RUNNER_TEMP/full-native-media"
          rm -rf "$MEDIA_ROOT"
          mkdir -p "$MEDIA_ROOT"
          audio_albums=(
            dies-iovis dies-solis dies-martis dies-albini dies-tigris dies-delfini
            dies-canis dies-felis dies-tauri dies-ursi dies-apri
          )
          for album in "${audio_albums[@]}"; do
            mkdir -p "$MEDIA_ROOT/$album"
            gh release download "$album" \
              --repo bryanzzai/bryanmackayne \
              --pattern '*.web.m4a' \
              --dir "$MEDIA_ROOT/$album" \
              --clobber
          done
          mkdir -p "$MEDIA_ROOT/dies-akita"
          gh release download dies-akita \
            --repo bryanzzai/bryanmackayne \
            --pattern '*.mp4' \
            --dir "$MEDIA_ROOT/dies-akita" \
            --clobber

          audio_count=$(find "$MEDIA_ROOT" -type f -name '*.web.m4a' | wc -l | tr -d ' ')
          video_count=$(find "$MEDIA_ROOT" -type f -name '*.mp4' | wc -l | tr -d ' ')
          originals=$(find "$MEDIA_ROOT" -type f -name '*.m4a' ! -name '*.web.m4a' | wc -l | tr -d ' ')
          test "$audio_count" = 229
          test "$video_count" = 9
          test "$originals" = 0
          echo "Catalog authority media verified: $audio_count web M4A + $video_count MP4; original M4A: $originals"

      - name: Generate exact catalog and external-library manifest
        shell: bash
        run: |
          set -euo pipefail
          node Scripts/generate_full_catalog.mjs \
            --source "$RUNNER_TEMP/bryanmackayne-source" \
            --media-root "$RUNNER_TEMP/full-native-media" \
            --ci-resource-dir "$PWD/ci-resources" \
            --output-swift "$PWD/App/Sources/Catalog.generated.swift" \
            --output-manifest "$PWD/App/Generated/ResourceManifest.tsv" \
            --output-report "$PWD/App/Generated/CatalogReport.txt"
          cat App/Generated/CatalogReport.txt
          test "$(find ci-resources -maxdepth 1 -type f -name '*__audio__*.web.m4a' | wc -l | tr -d ' ')" = 229
          test "$(find ci-resources -maxdepth 1 -type f -name '*__video__*.mp4' | wc -l | tr -d ' ')" = 9

      - name: Generate Xcode 15 compatible project
        run: |
          xcodegen generate
          test -d The12DayDancer.xcodeproj
          grep -q 'objectVersion = 60;' The12DayDancer.xcodeproj/project.pbxproj
          grep -q 'compatibilityVersion = "Xcode 15.0";' The12DayDancer.xcodeproj/project.pbxproj
          if grep -q 'preferredProjectObjectVersion' The12DayDancer.xcodeproj/project.pbxproj; then
            echo 'Xcode 16 preferredProjectObjectVersion leaked into Xcode 15 project.' >&2
            exit 1
          fi

      - name: Compile iPhone 12 Pro Max SideStore Lite app
        shell: bash
        run: |
          set -o pipefail
          THE12_PRESTAGED_RESOURCES="$PWD/ci-resources" \
          xcodebuild \
            -project The12DayDancer.xcodeproj \
            -scheme The12DayDancer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild-iphone12-promax.log

      - name: Verify dedicated iPhone Lite app
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*Build/Products/Debug-iphonesimulator/The 12 Day Dancer.app' -print -quit)
          test -n "$APP"
          RES="$APP/ConcertResources"
          test -d "$RES"
          test -s "$RES/facade__background__bulgarian-ballerina.png"
          test -s "$RES/SOURCE-SITE-COMMIT.txt"

          audio_count=$(find "$APP" -type f -name '*.m4a' | wc -l | tr -d ' ')
          video_count=$(find "$APP" -type f -name '*.mp4' | wc -l | tr -d ' ')
          resource_count=$(find "$RES" -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$audio_count" = 0
          test "$video_count" = 0
          test "$resource_count" = 2

          grep -q 'SIDESTORE-LITE-RESOURCE-ROOT' App/Sources/The12DayDancerApp.swift
          grep -q 'SIDESTORE-LITE-THUMBNAIL-RESOURCE-ROOT' App/Sources/FilmThumbnailView.swift
          grep -q 'IPHONE12-PRO-MAX-ROOT' App/Sources/The12DayDancerApp.swift
          grep -q 'IPHONE12-PRO-MAX-UI' App/Sources/iPhone12ProMaxUI.swift

          APP_PLIST="$APP/Info.plist" python3 - <<'PY'
          import os, plistlib
          path = os.environ['APP_PLIST']
          with open(path, 'rb') as handle:
              info = plistlib.load(handle)
          assert info.get('CFBundleIdentifier') == 'dk.bryanmackayne.the12daydancer.iphone12promax', info.get('CFBundleIdentifier')
          assert info.get('UIDeviceFamily') == [1], info.get('UIDeviceFamily')
          orientations = set(info.get('UISupportedInterfaceOrientations', []))
          expected = {
              'UIInterfaceOrientationPortrait',
              'UIInterfaceOrientationPortraitUpsideDown',
              'UIInterfaceOrientationLandscapeLeft',
              'UIInterfaceOrientationLandscapeRight',
          }
          assert expected.issubset(orientations), orientations
          print('iPhone-only device family, dedicated bundle id and free rotation verified.')
          PY

          /usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$APP/Info.plist" | grep -q true
          /usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' "$APP/Info.plist" | grep -q true

          size_mb=$(du -sm "$APP" | awk '{print $1}')
          test "$size_mb" -lt 100
          echo "iPhone SideStore Lite built app: $APP"
          echo "Validation: iPhone only; dedicated portrait-first UI; free rotation; 0 M4A; 0 MP4; 2 bootstrap files; external Documents resolver; ${size_mb} MB."

      - name: Package ready-to-open Xcode 15.2 iPhone project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery
          ROOT=delivery/The-12-Day-Dancer-iPhone12ProMax-SIDESTORE-LITE
          mkdir -p "$ROOT"

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='delivery' \
            --exclude='ci-resources' \
            --exclude='xcodebuild-iphone12-promax.log' \
            ./ "$ROOT/"

          cp xcodebuild-iphone12-promax.log "$ROOT/XCODEBUILD-iPHONE12-PROMAX-GREEN.log"
          cp SOURCE-SITE-COMMIT.txt "$ROOT/SOURCE-SITE-COMMIT.txt"

          cat > "$ROOT/OPEN-ME-FIRST.txt" <<'TXT'
          THE 12 DAY DANCER — iPHONE 12 PRO MAX — SIDESTORE LITE

          Purpose:
            Dedicated iPhone 12 Pro Max edition.
            Portrait-first UI with large controls and the full 12DD functionality.
            Rotation is left to normal iOS behaviour; Akita full-screen video may use landscape naturally.
            The full concert library is NOT baked into the signed app.

          This exact project was generated and compiled successfully by GitHub Actions.
          CI verified:
            - iPhone device family only
            - bundle id dk.bryanmackayne.the12daydancer.iphone12promax
            - dedicated iPhone 12 Pro Max UI is the app root
            - all four standard interface orientations remain available to iOS
            - exact 12-album catalog generated from the concert-house source of truth
            - 229 web M4A + 9 MP4 identities validated against Releases
            - built app contains 0 M4A and 0 MP4
            - only ballerina facade + source marker are bundled as bootstrap resources
            - Documents/ConcertResources is the preferred runtime media location
            - Akita poster frames use the same external ConcertResources library
            - Finder Files sharing is enabled
            - Xcode 15.0/15.2 compatible project format

          On Ventura with Xcode 15.2:
          1. Open The12DayDancer.xcodeproj.
          2. Select The12DayDancer target -> Signing & Capabilities -> Bryan's Personal Team.
          3. Select the physical iPhone 12 Pro Max.
          4. Product -> Build.
          5. Use Product -> Show Build Folder in Finder and take the Debug-iphoneos app.
          6. Package it as an IPA with Payload/The 12 Day Dancer.app at archive root.
          7. Install the small IPA through SideStore with LocalDevVPN enabled.
          8. Copy the existing permanent ConcertResources folder into the app's Documents folder.

          Do not change or rebuild the proven iPad sidestore-lite branch for this iPhone edition.
          TXT

          ditto -c -k --sequesterRsrc --keepParent \
            "$ROOT" \
            delivery/The-12-Day-Dancer-iPhone12ProMax-SIDESTORE-LITE-Xcode15.2-READY.zip
          ls -lh delivery/The-12-Day-Dancer-iPhone12ProMax-SIDESTORE-LITE-Xcode15.2-READY.zip

      - name: Upload iPhone 12 Pro Max Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: The-12-Day-Dancer-iPhone12ProMax-SIDESTORE-LITE-Xcode15.2-READY
          path: delivery/The-12-Day-Dancer-iPhone12ProMax-SIDESTORE-LITE-Xcode15.2-READY.zip
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
