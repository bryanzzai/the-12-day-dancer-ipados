name: Build iPad Air 2 TrollStore edition

on:
  workflow_dispatch:
  push:
    branches: [ipad-air-2]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout iPad Air 2 source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Checkout current concert-house source of truth
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SITE="$RUNNER_TEMP/bryanmackayne-source"
          rm -rf "$SOURCE_SITE"
          git clone --depth 1 https://github.com/bryanzzai/bryanmackayne.git "$SOURCE_SITE"
          git -C "$SOURCE_SITE" rev-parse HEAD | tee SOURCE-SITE-COMMIT.txt

      - name: Download exact release media for catalog validation only
        shell: bash
        run: |
          set -euo pipefail
          MEDIA_ROOT="$RUNNER_TEMP/full-native-media"
          rm -rf "$MEDIA_ROOT"
          mkdir -p "$MEDIA_ROOT"
          audio_albums=(
            dies-iovis dies-solis dies-martis dies-albini dies-tigris dies-delfini
            dies-canis dies-felis dies-tauri dies-ursi dies-apri
          )
          for album in "${audio_albums[@]}"; do
            mkdir -p "$MEDIA_ROOT/$album"
            gh release download "$album" \
              --repo bryanzzai/bryanmackayne \
              --pattern '*.web.m4a' \
              --dir "$MEDIA_ROOT/$album" \
              --clobber
          done
          mkdir -p "$MEDIA_ROOT/dies-akita"
          gh release download dies-akita \
            --repo bryanzzai/bryanmackayne \
            --pattern '*.mp4' \
            --dir "$MEDIA_ROOT/dies-akita" \
            --clobber

          audio_count=$(find "$MEDIA_ROOT" -type f -name '*.web.m4a' | wc -l | tr -d ' ')
          video_count=$(find "$MEDIA_ROOT" -type f -name '*.mp4' | wc -l | tr -d ' ')
          test "$audio_count" = 229
          test "$video_count" = 9
          echo "Catalog authority verified: $audio_count audio + $video_count video."

      - name: Generate exact catalog and external-library manifest
        shell: bash
        run: |
          set -euo pipefail
          node Scripts/generate_full_catalog.mjs \
            --source "$RUNNER_TEMP/bryanmackayne-source" \
            --media-root "$RUNNER_TEMP/full-native-media" \
            --ci-resource-dir "$PWD/ci-resources" \
            --output-swift "$PWD/App/Sources/Catalog.generated.swift" \
            --output-manifest "$PWD/App/Generated/ResourceManifest.tsv" \
            --output-report "$PWD/App/Generated/CatalogReport.txt"
          cat App/Generated/CatalogReport.txt

      - name: Apply external-library, iPad Air 2 compatibility and full-screen patches
        run: |
          set -euo pipefail
          python3 Scripts/apply_sidestore_lite.py
          python3 Scripts/apply_ipad_air2_compat.py
          grep -q 'SIDESTORE-LITE-RESOURCE-ROOT' App/Sources/The12DayDancerApp.swift
          grep -q 'SIDESTORE-LITE-THUMBNAIL-RESOURCE-ROOT' App/Sources/FilmThumbnailView.swift
          grep -q 'navigationViewStyle(StackNavigationViewStyle())' App/Sources/The12DayDancerApp.swift

      - name: Generate Xcode 15 compatible project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d The12DayDancer.xcodeproj
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' The12DayDancer.xcodeproj/project.pbxproj

      - name: Compile unsigned arm64 iPad app
        shell: bash
        run: |
          set -o pipefail
          THE12_PRESTAGED_RESOURCES="$PWD/ci-resources" \
          xcodebuild \
            -project The12DayDancer.xcodeproj \
            -scheme The12DayDancer \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-ipad-air2.log

      - name: Verify iPad Air 2 full-screen build
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*Build/Products/Debug-iphoneos/The 12 Day Dancer.app' -print -quit)
          test -n "$APP"
          test -d "$APP/ConcertResources"
          test -s "$APP/ConcertResources/facade__background__bulgarian-ballerina.png"

          audio_count=$(find "$APP" -type f -name '*.m4a' | wc -l | tr -d ' ')
          video_count=$(find "$APP" -type f -name '*.mp4' | wc -l | tr -d ' ')
          test "$audio_count" = 0
          test "$video_count" = 0

          grep -q 'SIDESTORE-LITE-RESOURCE-ROOT' App/Sources/The12DayDancerApp.swift
          grep -q 'SIDESTORE-LITE-THUMBNAIL-RESOURCE-ROOT' App/Sources/FilmThumbnailView.swift

          APP_PLIST="$APP/Info.plist" python3 - <<'PY'
          import os, plistlib
          with open(os.environ['APP_PLIST'], 'rb') as f:
              info = plistlib.load(f)
          assert info.get('CFBundleIdentifier') == 'dk.bryanmackayne.the12daydancer', info.get('CFBundleIdentifier')
          assert info.get('UIDeviceFamily') == [2], info.get('UIDeviceFamily')
          assert info.get('MinimumOSVersion') == '15.0', info.get('MinimumOSVersion')
          assert info.get('UIRequiresFullScreen') is True, info.get('UIRequiresFullScreen')
          assert info.get('UIFileSharingEnabled') is True, info.get('UIFileSharingEnabled')
          assert info.get('LSSupportsOpeningDocumentsInPlace') is True, info.get('LSSupportsOpeningDocumentsInPlace')
          print('Verified iPad-only, iPadOS 15.0 minimum, full-screen-only, file-sharing enabled app.')
          PY

          /usr/bin/file "$APP/The 12 Day Dancer" | grep -q arm64
          echo "Air 2 build verified: arm64, iPad family, iPadOS 15.0 minimum, full-screen-only, Documents/ConcertResources resolver, no concert media embedded."
          echo "$APP" > AIR2_APP_PATH.txt

      - name: Package TrollStore IPA and Xcode project
        shell: bash
        run: |
          set -euo pipefail
          APP=$(cat AIR2_APP_PATH.txt)
          rm -rf delivery Payload
          mkdir -p delivery Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload delivery/The-12-Day-Dancer-iPad-Air-2-TrollStore.ipa

          python3 - <<'PY'
          import zipfile
          p='delivery/The-12-Day-Dancer-iPad-Air-2-TrollStore.ipa'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
          assert any(n.startswith('Payload/') and n.endswith('.app/') for n in names), 'IPA missing Payload/*.app/'
          print('Verified IPA contains Payload/*.app/.')
          PY

          ROOT=delivery/The-12-Day-Dancer-iPad-Air-2-Xcode15.2
          mkdir -p "$ROOT"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='delivery' \
            --exclude='Payload' \
            --exclude='ci-resources' \
            --exclude='xcodebuild-ipad-air2.log' \
            ./ "$ROOT/"
          cp xcodebuild-ipad-air2.log "$ROOT/XCODEBUILD-iPAD-AIR2-GREEN.log"
          cp SOURCE-SITE-COMMIT.txt "$ROOT/SOURCE-SITE-COMMIT.txt"
          cat > "$ROOT/OPEN-ME-FIRST.txt" <<'TXT'
          THE 12 DAY DANCER — iPAD AIR 2 — TROLLSTORE EDITION

          Dedicated compatibility build for Bryan's reference iPad Air 2.
          Minimum OS: iPadOS 15.0. Device family: iPad. Architecture: arm64.
          Full-screen single-column navigation; iPad split-view/multitasking chrome disabled.
          Bundle id: dk.bryanmackayne.the12daydancer.
          The concert library remains external in Documents/ConcertResources.

          GitHub Actions compiled and validated the exact source in this archive.
          The accompanying IPA is unsigned and packaged conventionally for TrollStore.
          TXT
          ditto -c -k --sequesterRsrc --keepParent "$ROOT" delivery/The-12-Day-Dancer-iPad-Air-2-Xcode15.2-READY.zip
          ls -lh delivery/*

      - name: Upload iPad Air 2 TrollStore package
        uses: actions/upload-artifact@v4
        with:
          name: The-12-Day-Dancer-iPad-Air-2-TrollStore
          path: |
            delivery/The-12-Day-Dancer-iPad-Air-2-TrollStore.ipa
            delivery/The-12-Day-Dancer-iPad-Air-2-Xcode15.2-READY.zip
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
