name: The12DayDancer
options:
  bundleIdPrefix: dk.bryanmackayne
  xcodeVersion: "15.2"
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  The12DayDancer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
    preBuildScripts:
      - name: Apply native UI refinements
        path: Scripts/run_ui_fixes.sh
        shell: /bin/bash
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Stage SideStore Lite bootstrap
        path: Scripts/stage_resources.sh
        shell: /bin/bash
        basedOnDependencyAnalysis: false
      - name: Stage ballerina app icon
        path: Scripts/stage_app_icon.sh
        shell: /bin/bash
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.bryanmackayne.the12daydancer
        PRODUCT_NAME: The 12 Day Dancer
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  The12DayDancer:
    build:
      targets:
        The12DayDancer: all
    run:
      config: Debug
    archive:
      config: Release
