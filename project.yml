name: The12DayDancer
options:
  bundleIdPrefix: dk.bryanmackayne
  xcodeVersion: "15.2"
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  The12DayDancer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
    postBuildScripts:
      - name: Stage full local concert resources
        path: Scripts/stage_resources.sh
        shell: /bin/bash
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.bryanmackayne.the12daydancer
        PRODUCT_NAME: The 12 Day Dancer
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: The 12 Day Dancer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
schemes:
  The12DayDancer:
    build:
      targets:
        The12DayDancer: all
    run:
      config: Debug
    archive:
      config: Release
