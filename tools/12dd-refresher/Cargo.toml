[package]
name = "12dd-refresher"
version = "0.1.0"
edition = "2024"
description = "A tiny Windows-side refresher for The 12 Day Dancer"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
idevice = { version = "0.1.61", default-features = false, features = ["ring", "usbmuxd"] }
isideload = { version = "0.3.17", git = "https://github.com/nab138/isideload", package = "isideload", rev = "f2fd29abbb45a49fb79fdec22aa405cca05a5777" }
keyring = { version = "3.6.3", features = ["windows-native"] }
rpassword = "7"
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
